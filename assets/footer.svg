<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="220" viewBox="0 0 1200 220" role="img" aria-label="Thanks for playing! Press start to collaborate.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#101a3a"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7df9ff"/>
      <stop offset="0.5" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#ff5fd2"/>
    </linearGradient>
    <clipPath id="frame"><rect width="1200" height="220" rx="24"/></clipPath>
    <style>
      .mono { font-family: 'JetBrains Mono', Consolas, Menlo, 'Courier New', monospace; }
      .blink { animation: blink 1.2s steps(1) infinite; }
      @keyframes blink { 50% { opacity: 0 } }
      .grid { animation: grid 1.6s linear infinite; }
      @keyframes grid { from { transform: translateY(0) } to { transform: translateY(20px) } }
      .twinkle { animation: twinkle 3s ease-in-out infinite; }
      .t2 { animation-delay: -1s } .t3 { animation-delay: -2s }
      @keyframes twinkle { 0%,100% { opacity: .2 } 50% { opacity: 1 } }
    </style>
  </defs>
  <g clip-path="url(#frame)">
    <rect width="1200" height="220" fill="url(#bg)"/>
    <g fill="#cfefff">
      <circle class="twinkle" cx="120" cy="40" r="1.5"/><circle class="twinkle t2" cx="300" cy="80" r="1.2"/>
      <circle class="twinkle t3" cx="880" cy="36" r="1.6"/><circle class="twinkle" cx="1060" cy="90" r="1.2"/>
      <circle class="twinkle t2" cx="1140" cy="30" r="1"/><circle class="twinkle t3" cx="60" cy="110" r="1"/>
    </g>
    <g stroke="#00b4d8" stroke-opacity="0.35">
      <g class="grid">
        <line x1="0" y1="160" x2="1200" y2="160"/><line x1="0" y1="180" x2="1200" y2="180"/>
        <line x1="0" y1="200" x2="1200" y2="200"/><line x1="0" y1="220" x2="1200" y2="220"/>
      </g>
      <line x1="600" y1="160" x2="600" y2="220"/>
      <line x1="600" y1="160" x2="420" y2="220"/><line x1="600" y1="160" x2="780" y2="220"/>
      <line x1="600" y1="160" x2="200" y2="220"/><line x1="600" y1="160" x2="1000" y2="220"/>
      <line x1="600" y1="160" x2="-40" y2="220"/><line x1="600" y1="160" x2="1240" y2="220"/>
    </g>
    <rect x="0" y="140" width="1200" height="20" fill="#0f1733"/>
    <line x1="0" y1="160" x2="1200" y2="160" stroke="#7df9ff" stroke-opacity="0.7"/>

    <text x="600" y="78" text-anchor="middle" class="mono" font-size="40" font-weight="800" fill="url(#title)" letter-spacing="4">THANKS FOR PLAYING!</text>
    <text x="600" y="120" text-anchor="middle" class="mono" font-size="16" fill="#8b949e" letter-spacing="3"><tspan class="blink" fill="#febc2e">▶ PRESS START</tspan>  to build something together</text>
  </g>
  <rect x="0.75" y="0.75" width="1198.5" height="218.5" rx="23.5" fill="none" stroke="#00b4d8" stroke-opacity="0.35" stroke-width="1.5"/>
</svg>
