<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="230" viewBox="0 0 1000 230" role="img" aria-label="Thanks for stopping by! Press the button to visit my website.">
<title>Thanks for stopping by! Press the button to visit my website.</title>
<style>
.btn { animation: push 3s ease-in-out infinite; }
@keyframes push { 0%, 70%, 100% { transform: translateY(0); } 80% { transform: translateY(8px); } }
.spark { opacity: 0; animation: spark 3s ease-out infinite; transform-box: fill-box; transform-origin: center; }
@keyframes spark { 0%, 78% { opacity: 0; transform: scale(.6); } 85% { opacity: 1; } 100% { opacity: 0; transform: scale(1.25); } }
.caret { animation: caret 1s steps(1) infinite; }
@keyframes caret { 50% { opacity: 0; } }

@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }</style>
<defs><filter id="soft" x="-30%" y="-30%" width="160%" height="180%"><feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#5b4a3a" flood-opacity="0.16"/></filter></defs>
<rect width="1000" height="230" rx="30" fill="#fbf6ef"/>
<rect x="1" y="1" width="998" height="228" rx="29" fill="none" stroke="#e6dccd" stroke-width="2"/>
<text x="60" y="96" font-family="'SF Pro Rounded', ui-rounded, 'Nunito', 'Segoe UI Variable Display', 'Segoe UI', system-ui, sans-serif" font-size="34" font-weight="800" fill="#2e2a36">thanks for stopping by!</text>
<text x="62" y="134" font-family="'SF Pro Rounded', ui-rounded, 'Nunito', 'Segoe UI Variable Display', 'Segoe UI', system-ui, sans-serif" font-size="18" font-weight="600" fill="#6f6878">press the big button to see what i'm building lately</text>
<text x="62" y="176" font-family="ui-monospace, 'SF Mono', 'Cascadia Mono', Consolas, 'Liberation Mono', monospace" font-size="15" fill="#e89d84">ruchiraedirisinghe.vercel.app<tspan class="caret" fill="#2e2a36">_</tspan></text>
