<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="28" viewBox="0 0 1200 28" role="img" aria-label="divider">
  <defs>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00b4d8" stop-opacity="0"/>
      <stop offset="0.2" stop-color="#00b4d8"/>
      <stop offset="0.5" stop-color="#a78bfa"/>
      <stop offset="0.8" stop-color="#ff5fd2"/>
      <stop offset="1" stop-color="#ff5fd2" stop-opacity="0"/>
    </linearGradient>
    <style>
      .runner { animation: run 7s linear infinite; }
      @keyframes run { from { transform: translateX(60px) } to { transform: translateX(1120px) } }
      .hop { animation: hop .5s ease-in-out infinite alternate; }
      @keyframes hop { from { transform: translateY(0) } to { transform: translateY(-5px) } }
    </style>
  </defs>
  <rect x="0" y="18" width="1200" height="2" fill="url(#line)"/>
  <g fill="#7df9ff" opacity="0.6">
    <rect x="300" y="17" width="4" height="4"/><rect x="600" y="17" width="4" height="4"/><rect x="900" y="17" width="4" height="4"/>
  </g>
  <g class="runner">
    <g class="hop">
      <rect x="0" y="6" width="10" height="10" fill="#7df9ff"/>
      <rect x="-8" y="10" width="6" height="2" fill="#7df9ff" opacity="0.6"/>
      <rect x="-16" y="10" width="5" height="2" fill="#7df9ff" opacity="0.3"/>
    </g>
  </g>
</svg>
