<style>
.pop { animation: pop 6s ease-in-out infinite; animation-delay: -0.0s; }
@keyframes pop { 0%, 8%, 100% { transform: translateY(0); } 4% { transform: translateY(-4px); } }
.shine { animation: shine 6s ease-in-out infinite; animation-delay: 0.0s; }
@keyframes shine { 0%, 4% { transform: skewX(-20deg) translateX(-60px); } 22%, 100% { transform: skewX(-20deg) translateX(300px); } }
.go { animation: go 2.4s ease-in-out infinite; animation-delay: -0.0s; }
@keyframes go { 50% { transform: translate(2px, -2px); } }

@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; } }</style>
