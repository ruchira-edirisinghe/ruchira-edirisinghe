<title>About me. Working on Catalogie, a media tracker: every hour, accounted for. Studied BSc (Hons) Computer Security at the University of Plymouth, UK. Exploring game design and motion. Also into 3D and AI-powered workflows (Blender, Spline, Claude).</title>
