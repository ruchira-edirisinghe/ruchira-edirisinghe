name: Generate profile assets

# Builds the contribution snake and the live stat cards, then publishes them
# together to the `output` branch (one job, so neither overwrites the other).
on:
  schedule:
    - cron: "17 */3 * * *" # every 3 hours
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - name: Generate stat cards
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 .github/scripts/stat_cards.py "${{ github.repository_owner }}" dist

      - name: Generate snake SVGs
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=#E89D84&color_dots=#EFE8DD,#D3E6CC,#B2D0A9,#97BA8E,#6E9E66
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#F6B89F&color_dots=#161b22,#2c3b2a,#4c6b45,#76a06c,#B2D0A9

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
