name: Generate profile assets

# Builds the live stat panels (stats, streak, languages, activity, achievements)
# and the framed contribution snake, then publishes them
# together to the `output` branch (one job, so neither overwrites the other).
on:
  schedule:
    - cron: "17 */3 * * *" # every 3 hours
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - name: Generate stat cards
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 .github/scripts/stat_cards.py "${{ github.repository_owner }}" dist

      - name: Generate snake SVG
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake-dark.svg?color_snake=#F6B89F&color_dots=#2a2540,#3f6a45,#5f9a5f,#8cc47e,#c8eab8

      - name: Frame the snake to match the README
        run: python3 .github/scripts/frame_snake.py dist/github-snake-dark.svg dist/snake.svg

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
